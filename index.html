    const camelCase = (str) => str.replace(/-([a-z])/g, (g) => g[1].toUpperCase());

    const LucideIcon = ({ name, size = 24, className = "", ...props }) => {
      const iconNode = window.lucide.icons[name];
      if (!iconNode) return null;

      // Mendukung format struktur array Lucide versi baru dan lama
      const childrenNodes = Array.isArray(iconNode[0]) ? iconNode : (iconNode[2] || []);

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth={2}
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          {...props}
        >
          {childrenNodes.map(([tag, attrs], index) => {
            const reactAttrs = {};
            for (const [key, value] of Object.entries(attrs || {})) {
              reactAttrs[camelCase(key)] = value;
            }
            return React.createElement(tag, { key: index, ...reactAttrs });
          })}
        </svg>
      );
    };

              className="w-full bg-white/20 hover:bg-white/30 transition backdrop-blur-sm border border-white/20 text-white py-3 rounded-2xl font-medium relative z-10 flex items-center justify-center gap-2 shadow-sm"

              View Route Planner <ChevronLeft className="rotate-180" size={18} />

            <h3 className="text-slate-800 font-medium text-lg mb-4">Categories</h3>

              {["All", "Heritage", "Nature", "Culinary", "Art"].map((cat) => (
                <button
                  key={cat}
                  onClick={() => setActiveCategory(cat)}
                  className={`px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors shadow-sm ${activeCategory === cat ? "bg-blue-600 text-white" : "bg-white text-slate-600 border border-slate-100 hover:bg-slate-50"}`}
                >
                  {cat}
                </button>
              ))}
            </div>
          </div>

          {/* Popular Destinations */}
          <div className="mb-8">
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-slate-800 font-medium text-lg">
                {activeCategory === "All" ? "31 Destinasi Wisata" : `${displayedDestinations.length} ${activeCategory} Destinations`}
              </h3>
              <button className="text-blue-600 text-sm font-medium">View All &gt;</button>
            </div>
            <div 
              ref={carouselRef}
              onMouseEnter={() => setIsCarouselPaused(true)}
              onMouseLeave={() => setIsCarouselPaused(false)}
              onTouchStart={() => setIsCarouselPaused(true)}
              onTouchEnd={() => setIsCarouselPaused(false)}
              className="flex gap-4 overflow-x-auto no-scrollbar pb-4 -mx-5 px-5 snap-x snap-mandatory"
            >
              {displayedDestinations.map((dest) => (
                <div
                  key={dest.id}
                  onClick={() => onNavigateToDetail(dest.id)}
                  className="min-w-[280px] snap-center shrink-0 bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 cursor-pointer transform transition-transform hover:scale-[1.02]"
                >
                  <div className="h-44 w-full relative">
                    <img src={dest.image} alt={dest.name} className="w-full h-full object-cover" />
                    <div className="absolute top-3 right-3 bg-white/80 backdrop-blur-md rounded-full p-1.5 shadow-sm">
                      <Heart size={16} className="text-rose-500" />
                    </div>
                  </div>
                  <div className="p-4">
                    <h4 className="text-slate-800 font-medium mb-1 truncate">{dest.name}</h4>
                    <div className="flex items-center gap-1 text-slate-500 text-xs">
                      <Star size={12} className="text-yellow-400 fill-yellow-400" />
                      <span>{dest.rating}</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Nearby UMKM */}
          <div>
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-slate-800 font-medium text-lg">Nearby UMKM</h3>
              <button className="text-blue-600 text-sm font-medium">View All &gt;</button>
            </div>
            <div className="flex gap-4 overflow-x-auto no-scrollbar pb-4 -mx-5 px-5">

                <div
                  key={umkm.id}
                  onClick={() => setSelectedUMKM(umkm)}
                  className="min-w-[160px] max-w-[160px] bg-white rounded-2xl p-2 shadow-sm border border-slate-100 flex flex-col shrink-0 cursor-pointer hover:bg-slate-50 transition-colors"
                >
                  <div className="h-24 w-full rounded-xl overflow-hidden mb-2">
                    <img src={umkm.image} alt={umkm.name} className="w-full h-full object-cover" />
                  </div>
                  <div className="px-1 flex-1 flex flex-col">
                    <h4 className="text-[13px] font-semibold text-slate-800 truncate mb-1">{umkm.name}</h4>
                    <p className="text-[11px] text-slate-500 line-clamp-2 leading-snug mb-3 flex-1">{umkm.desc}</p>
                    <div className="flex justify-between mt-auto">
                      <div className="flex items-center gap-1 bg-slate-50 px-2 py-1 rounded-full">
                        <Star size={12} className="text-yellow-400 fill-yellow-400" />
                        <span className="text-[10px] font-medium text-slate-700">{umkm.rating}</span>
                      </div>
                      <div className="flex items-center gap-1 bg-slate-50 px-2 py-1 rounded-full">
                        <MapPin size={10} className="text-blue-500" />
                        <span className="text-[10px] font-medium text-slate-700">{umkm.distance}</span>
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* UMKM Modal */}
          {selectedUMKM && (
            <div className="absolute inset-0 z-[100] flex items-end sm:items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 sm:p-0 transition-opacity">
              <div className="bg-white w-full max-w-md sm:rounded-[24px] rounded-t-[24px] rounded-b-none sm:rounded-b-[24px] overflow-hidden shadow-2xl animate-in slide-in-from-bottom-8 relative">
                <div className="h-56 w-full relative">
                  <img src={selectedUMKM.image} alt={selectedUMKM.name} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-slate-900/60 to-transparent"></div>
                  <button 
                    onClick={() => setSelectedUMKM(null)} 
                    className="absolute top-4 right-4 bg-white/20 hover:bg-white/40 backdrop-blur-md p-2 rounded-full text-white transition"
                  >
                    <X size={20} />
                  </button>
                  <div className="absolute bottom-4 left-4 right-4">
                    <h2 className="text-2xl font-bold text-white mb-1">{selectedUMKM.name}</h2>
                    <div className="flex flex-wrap items-center gap-2 text-sm text-white/90">
                      <div className="flex items-center gap-1 bg-black/30 backdrop-blur-md px-2 py-1 rounded-full">
                        <Star size={14} className="text-yellow-400 fill-yellow-400" />
                        <span className="font-semibold">{selectedUMKM.rating}</span>
                        <span className="text-white/70 text-xs">({selectedUMKM.reviews})</span>
                      </div>
                      <div className="flex items-center gap-1 bg-black/30 backdrop-blur-md px-2 py-1 rounded-full">
                        <MapPin size={14} className="text-white" />
                        <span className="text-xs font-medium">{selectedUMKM.distance}</span>
                      </div>
                    </div>
                  </div>
                </div>
                
                <div className="p-6">
                  <p className="text-slate-600 text-sm leading-relaxed mb-5">{selectedUMKM.desc}</p>
                  <div className="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-5">
                    <h4 className="text-xs font-bold text-blue-600 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                      <Heart size={14} className="fill-blue-600" /> Rekomendasi Menu
                    </h4>
                    <div className="flex justify-between items-center">
                      <span className="text-slate-800 font-semibold">{selectedUMKM.recommendationItem}</span>
                      <span className="text-blue-700 font-bold bg-white px-3 py-1 rounded-full shadow-sm text-sm">
                        {selectedUMKM.price}
                      </span>
                    </div>
                  </div>
                  <div className="mb-2">
                    <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Tag</h4>
                    <div className="flex flex-wrap gap-2">
                      {selectedUMKM.tags.map((tag) => (
                        <span key={tag} className="px-3 py-1 bg-slate-100 border border-slate-200 text-slate-600 text-xs font-medium rounded-full">
                          {tag}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const RouteScreen = ({ onBack }) => {
      return (
        <div className="h-full flex flex-col bg-slate-50 relative pb-20">
          <div className="absolute top-0 w-full px-5 pt-12 pb-4 bg-white/80 backdrop-blur-md border-b border-slate-200 z-20 shadow-sm flex items-center gap-4">
            <button
              onClick={onBack}
              className="p-2 bg-white/80 backdrop-blur-sm shadow-sm rounded-full text-slate-800 border border-slate-200 hover:bg-white transition-colors"
            >
              <ChevronLeft size={24} />
            </button>
            <h1 className="text-xl font-semibold text-slate-800">Smart Route Planner</h1>
          </div>
          <div className="flex-1 w-full h-full relative z-10 bg-slate-200">
            <iframe
              src="https://khaq22.github.io/SmartTourism-Semarang-User/"
              width="100%"
              height="100%"
              style={{ border: 0, paddingTop: "80px" }}
              loading="lazy"
              referrerPolicy="no-referrer-when-downgrade"
            ></iframe>
          </div>
        </div>
      );
    };

    const MapScreen = () => {
      return (
        <div className="h-full flex flex-col bg-slate-50 relative pb-20">
          <div className="absolute top-0 w-full px-5 pt-12 pb-4 bg-white/80 backdrop-blur-md border-b border-slate-200 z-20 shadow-sm flex items-center justify-between">
            <h1 className="text-xl font-semibold text-slate-800">Semarang Tourism Map</h1>
            <button className="p-2 bg-slate-100 rounded-full text-slate-600 hover:bg-slate-200">
              <Search size={20} />
            </button>
          </div>
          <div className="flex-1 w-full h-full relative z-10 bg-slate-200">
            <iframe
              src="https://khaq22.github.io/SmartTourism-Semarang-User/persebaran.html"
              width="100%"
              height="100%"
              style={{ border: 0 }}
              loading="lazy"
              referrerPolicy="no-referrer-when-downgrade"
            ></iframe>
            <div className="absolute bottom-6 right-5 flex flex-col gap-3">
              <button className="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-lg border border-slate-100 text-blue-600 hover:bg-slate-50">
                <Navigation2 size={24} />
              </button>
            </div>
          </div>
        </div>
      );
    };

    const ProfileScreen = ({ onLogout }) => {
      const [currentBgIndex, setCurrentBgIndex] = useState(0);
      const [activeTab, setActiveTab] = useState('settings');

      const VISITED_TRIPS = DESTINATIONS.slice(0, 12).map((dest, index) => ({
        ...dest,
        moment: ["2 weeks ago", "Last month", "3 months ago", "4 months ago", "6 months ago", "Last summer", "1 year ago", "1 year ago", "2 years ago", "2 years ago", "3 years ago", "5 years ago"][index]
      }));

      const MY_REVIEWS = VISITED_TRIPS.slice(0, 8).map((trip, index) => ({
        ...trip,
        reviewScore: [5, 4, 5, 5, 4, 5, 5, 5][index],
        reviewText: [
          "Tempat yang sangat indah dan asri! Cocok untuk menenangkan pikiran dari hiruk-pikuk kota.",
          "Akses jalan sudah cukup baik, tapi fasilitas umum perlu ditingkatkan. Pemandangannya luar biasa.",
          "Selalu suka ke sini! Spot fotonya banyak dan Instagramable banget. Recommended!",
          "Harga tiket masuk sepadan dengan pengalaman yang didapatkan. Cuacanya juga sejuk.",
          "Lumayan bagus untuk liburan bersama keluarga, apalagi kalau cuaca sedang cerah.",
          "Keren! Sejarah tempat ini sangat menarik untuk dipelajari. Guide-nya juga informatif.",
          "Tidak pernah bosan berkunjung ke sini. Sangat terawat dan bersih.",
          "Sangat direkomendasikan bagi yang suka petualangan! Tracking sedikit tapi terbayar lunas."
        ][index]
      }));

      useEffect(() => {
        const interval = setInterval(() => {
          setCurrentBgIndex((prev) => (prev + 1) % DESTINATIONS.length);
        }, 4000);
        return () => clearInterval(interval);
      }, []);

      return (
        <div className="h-full flex flex-col bg-slate-50 overflow-y-auto no-scrollbar pb-24">
          <div className="h-48 relative overflow-hidden bg-slate-200">
            <img
              key={DESTINATIONS[currentBgIndex]?.id || currentBgIndex}
              src={DESTINATIONS[currentBgIndex]?.image || MOCK_IMAGES.lawangSewu}
              className="w-full h-full object-cover animate-fade-in"
              alt="Profile Banner"
            />
            <div className="absolute inset-0 bg-black/20"></div>
          </div>

          <div className="px-6 relative flex flex-col items-center">
            <div
              className="w-24 h-24 rounded-full border-4 border-white shadow-md flex items-center justify-center font-bold text-yellow-900 text-5xl -mt-12 mb-4 relative z-10"
              style={{ background: "linear-gradient(135deg, #FDE68A 0%, #F59E0B 50%, #D97706 100%)" }}
            >
              <div className="absolute inset-2 rounded-full border-[3px] border-yellow-700/30 flex items-center justify-center">
                <span style={{ textShadow: "0 2px 2px rgba(255,255,255,0.6)" }}>1</span>
              </div>
            </div>
            <h2 className="text-2xl font-bold text-slate-800">Juara 1</h2>
            <p className="text-slate-500 text-sm mb-6">juara.satu@example.com</p>

            <div className="w-full flex gap-4 mb-8">
              <div 
                onClick={() => setActiveTab(activeTab === 'trips' ? 'settings' : 'trips')}
                className={`flex-1 p-4 rounded-2xl shadow-sm border text-center cursor-pointer transition-colors ${
                  activeTab === 'trips' ? 'bg-blue-50 border-blue-200 ring-2 ring-blue-500/20' : 'bg-white border-slate-100 hover:bg-slate-50'
                }`}
              >
                <h3 className="text-2xl font-bold text-blue-600 mb-1">12</h3>
                <p className="text-xs text-slate-500 font-medium uppercase tracking-wider">Trips</p>
              </div>
              <div className="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center">
                <h3 className="text-2xl font-bold text-emerald-500 mb-1">4.9</h3>
                <p className="text-xs text-slate-500 font-medium uppercase tracking-wider">Rating</p>
              </div>
              <div 
                onClick={() => setActiveTab(activeTab === 'reviews' ? 'settings' : 'reviews')}
                className={`flex-1 p-4 rounded-2xl shadow-sm border text-center cursor-pointer transition-colors ${
                  activeTab === 'reviews' ? 'bg-amber-50 border-amber-200 ring-2 ring-amber-500/20' : 'bg-white border-slate-100 hover:bg-slate-50'
                }`}
              >
                <h3 className="text-2xl font-bold text-amber-500 mb-1">8</h3>
                <p className="text-xs text-slate-500 font-medium uppercase tracking-wider">Reviews</p>
              </div>
            </div>

            {activeTab === 'trips' ? (
              <div className="w-full space-y-4 animate-fade-in pb-8">
                <h3 className="text-lg font-bold text-slate-800 mb-2 text-left">Destinasi yang Pernah Dikunjungi</h3>
                {VISITED_TRIPS.map((trip) => (
                  <div key={trip.id} className="w-full flex items-center gap-4 bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
                    <div className="w-16 h-16 rounded-xl overflow-hidden shrink-0">
                      <img src={trip.image} alt={trip.name} className="w-full h-full object-cover" />
                    </div>
                    <div className="text-left flex-1">
                      <h4 className="text-slate-800 font-bold line-clamp-1">{trip.name}</h4>
                      <p className="text-xs text-slate-500 mt-1 flex items-center gap-1">
                        <MapPin size={12} className="text-blue-500" /> {trip.status}
                      </p>
                      <p className="text-xs text-amber-600 font-medium mt-1 italic">{trip.moment}</p>
                    </div>
                  </div>
                ))}
                <button
                  onClick={() => setActiveTab('settings')}
                  className="w-full mt-4 py-3 text-sm text-slate-500 hover:text-slate-700 font-medium bg-slate-100 rounded-xl"
                >
                  Kembali ke Pengaturan
                </button>
              </div>
            ) : activeTab === 'reviews' ? (
              <div className="w-full space-y-4 animate-fade-in pb-8">
                <h3 className="text-lg font-bold text-slate-800 mb-2 text-left w-full">Ulasan Saya</h3>
                {MY_REVIEWS.map((review) => (
                  <div key={`review-${review.id}`} className="w-full bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <div className="flex items-center gap-3 mb-3">
                      <div className="w-12 h-12 rounded-xl overflow-hidden shrink-0">
                        <img src={review.image} alt={review.name} className="w-full h-full object-cover" />
                      </div>
                      <div className="text-left flex-1">
                        <h4 className="text-slate-800 font-bold line-clamp-1">{review.name}</h4>
                        <div className="flex items-center gap-1 mt-0.5">
                          {[...Array(5)].map((_, i) => (
                            <Star key={i} size={12} className={i < review.reviewScore ? "fill-amber-400 text-amber-400" : "fill-slate-200 text-slate-200"} />
                          ))}
                        </div>
                      </div>
                      <span className="text-xs text-slate-400">{review.moment}</span>
                    </div>
                    <p className="text-sm text-slate-600 text-left leading-relaxed">"{review.reviewText}"</p>
                  </div>
                ))}
                <button
                  onClick={() => setActiveTab('settings')}
                  className="w-full mt-4 py-3 text-sm text-slate-500 hover:text-slate-700 font-medium bg-slate-100 rounded-xl"
                >
                  Kembali ke Pengaturan
                </button>
              </div>
            ) : (
              <div className="w-full space-y-3 animate-fade-in">
                <button className="w-full flex items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 hover:bg-slate-50 transition-colors">
                  <div className="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
                    <Settings size={20} />
                  </div>
                  <div className="text-left flex-1">
                    <h4 className="text-slate-800 font-medium">Account Settings</h4>
                    <p className="text-xs text-slate-500">Personal information, email</p>
                  </div>
                  <ChevronLeft size={20} className="text-slate-400 rotate-180" />
                </button>

                <button className="w-full flex items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 hover:bg-slate-50 transition-colors">
                  <div className="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600">
                    <Bell size={20} />
                  </div>
                  <div className="text-left flex-1">
                    <h4 className="text-slate-800 font-medium">Notifications</h4>
                    <p className="text-xs text-slate-500">Alerts, updates</p>
                  </div>
                  <ChevronLeft size={20} className="text-slate-400 rotate-180" />
                </button>

                <button className="w-full flex items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 hover:bg-slate-50 transition-colors">
                  <div className="w-10 h-10 rounded-full bg-purple-50 flex items-center justify-center text-purple-600">
                    <Shield size={20} />
                  </div>
                  <div className="text-left flex-1">
                    <h4 className="text-slate-800 font-medium">Privacy & Security</h4>
                    <p className="text-xs text-slate-500">Passwords, data</p>
                  </div>
                  <ChevronLeft size={20} className="text-slate-400 rotate-180" />
                </button>

                <button
                  onClick={onLogout}
                  className="w-full flex items-center gap-4 bg-rose-50 p-4 rounded-2xl border border-rose-100 hover:bg-rose-100 transition-colors mt-4"
                >
                  <div className="w-10 h-10 rounded-full bg-white flex items-center justify-center text-rose-500 shadow-sm">
                    <LogOut size={20} />
                  </div>
                  <div className="text-left flex-1">
                    <h4 className="text-rose-600 font-medium">Log Out</h4>
                  </div>
                </button>
              </div>
            )}
          </div>
        </div>
      );
    };

    const DetailScreen = ({ locationId, onBack, onNavigateToNearby }) => {
      const [selectedNearby, setSelectedNearby] = useState(null);
      const destination = DESTINATIONS.find((d) => d.id === locationId) || DESTINATIONS[0];
      const nearbyIds = NEARBY_MAPPING[destination.id] || ["simpang-lima", "lawang-sewu", "kota-lama"];
      const nearbyDestinations = DESTINATIONS.filter(d => nearbyIds.includes(d.id));

      return (
        <div className="h-full bg-slate-50 relative overflow-hidden">
          <div className="absolute top-0 w-full h-[45%]">
            <img src={destination.image} alt={destination.name} className="w-full h-full object-cover" />
            <div className="absolute inset-0 bg-gradient-to-t from-slate-50 via-transparent to-black/30"></div>
            <div className="absolute top-12 left-5 right-5 flex justify-between z-20">
              <button onClick={onBack} className="w-10 h-10 rounded-full bg-white/50 backdrop-blur-md border border-white/40 flex items-center justify-center text-slate-900 shadow-sm hover:bg-white/70 transition-colors">
                <ChevronLeft size={24} />
              </button>
              <button className="w-10 h-10 rounded-full bg-white/50 backdrop-blur-md border border-white/40 flex items-center justify-center text-slate-900 shadow-sm hover:bg-white/70 transition-colors">
                <MoreHorizontal size={24} />
              </button>
            </div>
          </div>

          <div className="absolute top-[40%] w-full h-[60%] bg-white rounded-t-[32px] px-6 pt-8 pb-8 flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.08)] z-10 border-t border-slate-100">
            <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto absolute top-3 left-1/2 -translate-x-1/2"></div>
            <div className="flex-1 overflow-y-auto no-scrollbar pb-24">
              <div className="mb-4">
                <h1 className="text-[26px] font-semibold text-slate-900 mb-2 leading-tight">{destination.name}</h1>
                <div className="flex items-center gap-2 mb-4">
                  <span className={`w-2.5 h-2.5 rounded-full ${destination.statusColor.replace("text-", "bg-")} animate-pulse`}></span>
                  <span className={`text-sm font-medium ${destination.statusColor}`}>{destination.status}</span>
                </div>
                <p className="text-slate-600 text-[15px] leading-relaxed mb-8">{destination.desc}</p>
              </div>

              <h3 className="text-slate-800 font-medium text-lg mb-4">Nearby Places</h3>
              <div className="flex gap-4 overflow-x-auto no-scrollbar pb-2 -mx-6 px-6">
                {nearbyDestinations.map((nearbyDest) => (
                  <div
                    key={nearbyDest.id}
                    onClick={() => setSelectedNearby(nearbyDest)}
                    className="min-w-[140px] max-w-[140px] bg-slate-50 rounded-[20px] p-2 border border-slate-100 shadow-sm cursor-pointer hover:bg-slate-100 transition-colors shrink-0"
                  >
                    <img src={nearbyDest.image} className="w-full h-[85px] rounded-2xl object-cover mb-2" alt={nearbyDest.name} />
                    <h4 className="text-sm font-medium text-slate-800 px-1 truncate">{nearbyDest.name}</h4>
                  </div>
                ))}
              </div>
            </div>

            <div className="absolute bottom-6 left-6 right-6">
              <button className="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white py-4 rounded-[20px] font-semibold text-[17px] shadow-[0_8px_30px_rgba(79,70,229,0.3)] transition-transform hover:scale-[1.02] active:scale-[0.98]">
                Add to Trip
              </button>
            </div>
          </div>

          {selectedNearby && (
            <div className="absolute inset-0 z-[100] flex items-end sm:items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 sm:p-0 transition-opacity">
              <div className="bg-white w-full max-w-md sm:rounded-[24px] rounded-t-[24px] rounded-b-none sm:rounded-b-[24px] overflow-hidden shadow-2xl animate-in slide-in-from-bottom-8 relative flex flex-col max-h-[90%]">
                <div className="h-56 w-full relative shrink-0">
                  <img src={selectedNearby.image} alt={selectedNearby.name} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-slate-900/60 to-transparent"></div>
                  <button onClick={() => setSelectedNearby(null)} className="absolute top-4 right-4 bg-white/20 hover:bg-white/40 backdrop-blur-md p-2 rounded-full text-white transition">
                    <X size={20} />
                  </button>
                  <div className="absolute bottom-4 left-4 right-4">
                    <h2 className="text-2xl font-bold text-white mb-1">{selectedNearby.name}</h2>
                    <div className="flex flex-wrap items-center gap-2 text-sm text-white/90">
                      <div className="flex items-center gap-1 bg-black/30 backdrop-blur-md px-2 py-1 rounded-full">
                        <Star size={14} className="text-yellow-400 fill-yellow-400" />
                        <span className="font-semibold">{selectedNearby.rating}</span>
                      </div>
                    </div>
                  </div>
                </div>
                
                <div className="p-6 overflow-y-auto no-scrollbar">
                  <div className="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-4">
                    <h4 className="text-xs font-bold text-blue-600 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                      <MapPin size={14} className="fill-blue-600" /> Keterangan Destinasi
                    </h4>
                    <p className="text-slate-600 text-sm leading-relaxed">{selectedNearby.desc}</p>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    function App() {
      const [appState, setAppState] = useState("landing");
      const [activeTab, setActiveTab] = useState("home");
      const [activeLocation, setActiveLocation] = useState(null);

      const isViewingDetail = activeLocation !== null;

      return (
        <div className="min-h-screen bg-slate-900 flex items-center justify-center p-2 sm:p-4">
          <div className="relative w-full max-w-[400px] h-[850px] max-h-[95vh] bg-slate-50 rounded-[35px] sm:rounded-[40px] shadow-[0_20px_50px_rgba(0,0,0,0.5)] overflow-hidden border-[6px] sm:border-[8px] border-slate-800 mx-auto flex flex-col">
            
            {appState === "landing" && <LandingScreen onNavigate={setAppState} />}
            {appState === "login" && <LoginScreen onNavigate={setAppState} onLogin={() => setAppState("main")} />}
            {appState === "signup" && <SignUpScreen onNavigate={setAppState} onLogin={() => setAppState("main")} />}

            {appState === "main" && (
              <>
                <div className={!isViewingDetail && activeTab === "home" ? "h-full" : "hidden"}>
                  <HomeScreen
                    onNavigateToRoute={() => setActiveTab("route")}
                    onNavigateToDetail={(id) => setActiveLocation(id)}
                    onNavigateToProfile={() => setActiveTab("profile")}
                  />
                </div>

                <div className={!isViewingDetail && activeTab === "route" ? "h-full" : "hidden"}>
                  <RouteScreen onBack={() => setActiveTab("home")} />
                </div>

                <div className={!isViewingDetail && activeTab === "map" ? "h-full" : "hidden"}>
                  <MapScreen />
                </div>

                <div className={!isViewingDetail && activeTab === "profile" ? "h-full" : "hidden"}>
                  <ProfileScreen
                    onLogout={() => {
                      setAppState("landing");
                      setActiveTab("home");
                    }}
                  />
                </div>

                {isViewingDetail && (
                  <DetailScreen
                    locationId={activeLocation}
                    onBack={() => setActiveLocation(null)}
                    onNavigateToNearby={(id) => setActiveLocation(id)}
                  />
                )}

                {!isViewingDetail && (
                  <BottomNavBar activeTab={activeTab} onTabChange={setActiveTab} />
                )}
              </>
            )}

            <div className="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-200 rounded-full z-[100] pointer-events-none"></div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/PrototypeSmartTourism_App/sw.js')
        .then(registration => {
          console.log('ServiceWorker berhasil didaftarkan:', registration.scope);
        })
        .catch(error => {
          console.log('Pendaftaran ServiceWorker gagal:', error);
        });
    });
  }
</script>
</body>
</html>
